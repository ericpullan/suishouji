<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111512" media="(prefers-color-scheme: dark)">
<title>随手记 · 每日消费</title>
<style>
  :root {
    --bg: #eef0ef;
    --card: #fcfdfc;
    --card-2: #f5f7f6;
    --ink: #1d2620;
    --ink-2: #5c665e;
    --ink-3: #90988f;
    --line: #e8e2d5;
    --line-strong: #dcd5c5;
    --accent: #2f7452;
    --accent-deep: #245c40;
    --accent-soft: #e6f1e8;
    --on-accent: #f7fbf7;
    --danger: #b4513f;
    --warn: #9a6a1f;
    --shadow: 0 10px 30px -18px rgba(43, 55, 44, .28);
    --glow-a: rgba(196, 219, 197, .55);
    --glow-b: rgba(240, 218, 183, .45);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111512;
      --card: #1a201b;
      --card-2: #20261f;
      --ink: #edf0ea;
      --ink-2: #a9b2aa;
      --ink-3: #788178;
      --line: #2a312b;
      --line-strong: #364038;
      --accent: #76c79a;
      --accent-deep: #8ed8ad;
      --accent-soft: #1f3126;
      --on-accent: #0e1712;
      --danger: #e28a77;
      --warn: #d6a85b;
      --shadow: 0 12px 34px -18px rgba(0, 0, 0, .8);
      --glow-a: rgba(52, 84, 62, .35);
      --glow-b: rgba(96, 72, 40, .22);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(700px 380px at 85% -8%, var(--glow-a), transparent 62%),
      radial-gradient(600px 340px at -12% 8%, var(--glow-b), transparent 58%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 26px 18px calc(44px + env(safe-area-inset-bottom));
  }

  /* ---------- 顶部 ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .logo {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: grid; place-items: center;
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: 24px;
    color: #f8fbf7;
    background: linear-gradient(145deg, #3b7d5b, #24543b);
    box-shadow: 0 8px 18px -8px rgba(36, 84, 59, .65), inset 0 1px 0 rgba(255, 255, 255, .25);
    user-select: none;
  }

  .titles h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .titles p {
    margin: 3px 0 0;
    font-size: 11.5px;
    color: var(--ink-3);
    letter-spacing: .03em;
  }

  .ghost-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
    transition: color .18s ease, border-color .18s ease, transform .18s ease;
  }

  .ghost-btn:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
    transform: translateY(-1px);
  }

  .ghost-btn svg { width: 14px; height: 14px; }

  /* ---------- 月份切换 ---------- */
  .monthbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    padding: 7px 9px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .month-nav {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink-2);
    transition: background .16s ease, color .16s ease, transform .16s ease;
  }

  .month-nav svg { width: 18px; height: 18px; }

  .month-nav:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
    transform: scale(1.06);
  }

  .month-nav:disabled { opacity: .28; cursor: not-allowed; }

  .month-center {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .month-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .month-reset {
    border: 0;
    padding: 0;
    background: transparent;
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--accent);
    line-height: 1.3;
  }

  .month-reset:disabled { color: var(--ink-3); cursor: default; }
  .month-reset:not(:disabled):hover { text-decoration: underline; }

  /* ---------- 文件提示 ---------- */
  .notice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 13px;
    margin-bottom: 16px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--warn) 10%, var(--card));
    border: 1px solid color-mix(in srgb, var(--warn) 24%, var(--line));
    color: var(--ink-2);
    font-size: 12px;
    line-height: 1.65;
  }

  .notice[hidden] { display: none; }
  .notice b { color: var(--ink); }
  .notice button {
    margin-left: auto;
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-size: 18px;
    line-height: 1;
    width: 24px; height: 24px;
    border-radius: 8px;
  }
  .notice button:hover { background: color-mix(in srgb, var(--warn) 14%, transparent); }

  /* ---------- 概览 ---------- */
  .summary {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 22px 20px;
    border-radius: 26px;
    background: linear-gradient(135deg, #2b5f45 0%, #347453 55%, #3f835f 100%);
    color: #f2f8f3;
    box-shadow: 0 22px 40px -24px rgba(33, 78, 55, .75), inset 0 1px 0 rgba(255, 255, 255, .15);
  }

  .summary::before {
    content: "";
    position: absolute;
    width: 210px; height: 210px;
    right: -70px; top: -110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .2), transparent 62%);
  }

  .summary::after {
    content: "";
    position: absolute;
    width: 150px; height: 150px;
    left: -70px; bottom: -110px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .12);
  }

  .sum-left { position: relative; z-index: 1; min-width: 0; flex: 1; }

  .sum-label {
    font-size: 11.5px;
    letter-spacing: .12em;
    color: rgba(244, 250, 246, .66);
  }

  .sum-amount {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    margin-top: 8px;
    font-size: clamp(28px, 8.2vw, 42px);
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .yen {
    font-size: .48em;
    margin-top: .36em;
    opacity: .75;
    font-weight: 500;
  }

  .sum-meta {
    margin-top: 9px;
    font-size: 11.5px;
    color: rgba(244, 250, 246, .62);
    letter-spacing: .02em;
  }

  .sum-right {
    position: relative;
    z-index: 1;
    text-align: right;
    padding-left: 18px;
    border-left: 1px solid rgba(255, 255, 255, .16);
    min-width: 108px;
    flex: 0 0 auto;
  }

  .sum-month {
    margin-top: 9px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- 本月分类 ---------- */
  .cats {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 2px 2px;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats:empty { display: none; }

  .cat-chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 11px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--ink-2);
    box-shadow: 0 4px 12px -10px rgba(0, 0, 0, .35);
  }

  .cat-chip .e { font-size: 13px; }
  .cat-chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 语音 ---------- */
  .listen {
    text-align: center;
    padding: 26px 0 0;
  }

  .mic {
    --mic-a: #3d8a62;
    --mic-b: #286248;
    position: relative;
    width: 92px; height: 92px;
    margin: 0 auto;
    border: 0;
    border-radius: 50%;
    color: #f4fbf6;
    display: grid;
    place-items: center;
    background: linear-gradient(155deg, var(--mic-a), var(--mic-b));
    box-shadow: 0 20px 38px -18px rgba(40, 98, 72, .75), inset 0 1px 0 rgba(255, 255, 255, .22);
    transition: transform .18s ease, box-shadow .25s ease, background .25s ease;
    touch-action: manipulation;
  }

  .mic:hover { transform: translateY(-2px); }
  .mic:active { transform: scale(.97); }
  .mic:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .mic svg { position: relative; z-index: 1; width: 34px; height: 34px; }
  .mic .ic-stop { display: none; width: 30px; height: 30px; }

  .mic.listening {
    --mic-a: #d97b59;
    --mic-b: #b9573d;
    box-shadow: 0 20px 38px -18px rgba(185, 87, 61, .7), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .mic.listening .ic-mic { display: none; }
  .mic.listening .ic-stop { display: block; }

  .mic::before, .mic::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(61, 138, 98, .55);
    opacity: 0;
    pointer-events: none;
  }

  .mic.listening::before {
    border-color: rgba(185, 87, 61, .55);
    animation: ripple 2.2s cubic-bezier(.2, .6, .3, 1) infinite;
  }
  .mic.listening::after {
    border-color: rgba(185, 87, 61, .4);
    animation: ripple 2.2s cubic-bezier(.2, .6, .3, 1) .8s infinite;
  }

  @keyframes ripple {
    0% { transform: scale(1); opacity: .75; }
    100% { transform: scale(1.75); opacity: 0; }
  }

  .hint {
    margin: 13px 0 0;
    min-height: 18px;
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: .02em;
    transition: color .2s ease;
  }

  .hint.warn { color: var(--warn); }
  .mic.listening + .hint { color: var(--danger); }

  .live {
    margin: 6px 0 0;
    min-height: 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1.5;
    transition: opacity .2s ease;
  }

  /* ---------- 手动输入 ---------- */
  .manual {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 6px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .manual:focus-within {
    border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .manual input {
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 13.5px;
    color: var(--ink);
  }

  .manual input::placeholder { color: var(--ink-3); }

  .manual button {
    flex: 0 0 auto;
    padding: 10px 18px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 13px;
    font-weight: 600;
    transform-origin: center;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
  }

  .manual button:hover {
    background: var(--accent-deep);
    transform: scale(1.05);
    box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .manual button:active { transform: scale(.98); }

  .manual input.shake { animation: shake .35s ease; }

  @keyframes shake {
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }

  /* ---------- 列表 ---------- */
  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 30px 4px 12px;
  }

  .list-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--ink-2);
  }

  .list-count {
    font-size: 11.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .day {
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px 9px;
    font-size: 12px;
    color: var(--ink-3);
  }

  .day-head strong {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    letter-spacing: .02em;
  }

  .day-total { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .items { padding-bottom: 4px; }

  .item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 14px;
    cursor: pointer;
    transition: background .16s ease;
  }

  .item + .item { border-top: 1px solid var(--line); }
  .item:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .item:focus-visible {
    outline: none;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .ic {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 18px;
    background: var(--accent-soft);
    background: color-mix(in srgb, var(--c, #6f7a73) 15%, transparent);
  }

  .main { flex: 1; min-width: 0; }

  .note {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: .02em;
  }

  .amt {
    flex: 0 0 auto;
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .amt .minus { color: var(--ink-3); font-weight: 400; margin-right: 1px; }

  .del {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border: 0;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--ink-3);
    opacity: 0;
    transition: opacity .15s ease, color .15s ease, background .15s ease;
  }

  .item:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
  }
  .del svg { width: 15px; height: 15px; }

  @media (hover: none) {
    .del { opacity: .55; }
  }

  .empty {
    padding: 38px 20px 42px;
    text-align: center;
    border: 1px dashed var(--line-strong);
    border-radius: 22px;
    background: color-mix(in srgb, var(--card) 65%, transparent);
  }

  .empty-emoji { font-size: 30px; opacity: .9; }

  .empty-title {
    margin: 12px 0 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .empty-sub {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--ink-3);
  }

  .foot {
    margin-top: 30px;
    text-align: center;
    color: var(--ink-3);
    font-size: 10.5px;
    line-height: 1.9;
    letter-spacing: .02em;
  }
  .foot p { margin: 0; }

  /* ---------- 提示条 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translate(-50%, 14px);
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: calc(100vw - 32px);
    padding: 10px 16px;
    border-radius: 999px;
    background: #1c2620;
    color: #f2f7f2;
    font-size: 12.5px;
    box-shadow: 0 16px 36px -14px rgba(0, 0, 0, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 60;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  .toast span {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast-action {
    flex: 0 0 auto;
    border: 0;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    color: #a9e3c0;
    font-size: 12px;
    font-weight: 600;
  }
  .toast-action:hover { background: rgba(255, 255, 255, .22); }

  /* ---------- 编辑弹窗 ---------- */
  dialog {
    width: min(420px, calc(100vw - 32px));
    padding: 0;
    border: 0;
    border-radius: 22px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 32px 80px -28px rgba(12, 20, 15, .6);
  }

  dialog::backdrop {
    background: rgba(16, 23, 18, .48);
    backdrop-filter: blur(3px);
  }

  .dlg-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px 4px;
  }

  .dlg-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .03em;
  }

  .x {
    width: 32px; height: 32px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-3);
    font-size: 22px;
    line-height: 1;
  }
  .x:hover { background: var(--accent-soft); color: var(--ink); }

  .field { display: block; padding: 10px 22px 0; }

  .field > span {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: .08em;
  }

  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: 0;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    transition: border-color .16s ease, box-shadow .16s ease;
  }

  .field input:focus, .field select:focus {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
    padding: 0 22px;
  }
  .row2 .field { padding: 10px 0 0; }

  #editForm { padding-bottom: 20px; }

  .dlg-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 18px 22px 0;
  }
  .dlg-actions .spacer { flex: 1; }

  .btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
  }

  .btn.ghost { background: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--card-2); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-deep); }

  .danger-text {
    border: 0;
    background: transparent;
    color: var(--danger);
    font-size: 12.5px;
    padding: 8px 0;
  }
  .danger-text:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .app { padding-left: 14px; padding-right: 14px; }
    .summary { padding: 20px 18px 18px; border-radius: 22px; }
    .sum-right { min-width: 96px; padding-left: 14px; }
    .sum-month { font-size: 16px; }
    .item { padding: 11px 12px; gap: 10px; }

<script>
(() => {
  'use strict';

  /* ================= 分类 ================= */
  const CATEGORIES = [
    { key: '餐饮', emoji: '🍜', color: '#c47a3a', words: ['早饭', '早餐', '午饭', '午餐', '中饭', '晚饭', '晚餐', '夜宵', '宵夜', '外卖', '食堂', '吃饭', '吃了', '吃', '咖啡', '奶茶', '饮料', '可乐', '矿泉水', '啤酒', '火锅', '烧烤', '麻辣烫', '米线', '面条', '拉面', '牛肉面', '泡面', '饺子', '包子', '馄饨', '粥', '米饭', '快餐', '汉堡', '披萨', '寿司', '蛋糕', '面包', '小吃', '餐厅', '饭店', '聚餐', '零食', '水果', '买菜'] },
    { key: '交通', emoji: '🚌', color: '#3f7fa3', words: ['打车', '滴滴', '出租车', '网约车', '公交', '地铁', '高铁', '火车', '飞机', '机票', '车票', '加油', '油费', '停车', '过路费', '高速费', '共享单车', '骑车', '车费', '充电', '哈啰', '青桔'] },
    { key: '购物', emoji: '🛍️', color: '#a35c86', words: ['衣服', '裤子', '裙子', '外套', '鞋子', '鞋', '帽子', '围巾', '包包', '背包', '淘宝', '京东', '拼多多', '网购', '快递', '化妆品', '口红', '面膜', '护肤', '数码', '耳机', '手机', '电脑', '家电', '首饰', '手表'] },
    { key: '日用', emoji: '🧻', color: '#6f8a52', words: ['超市', '便利店', '纸巾', '卫生纸', '洗发水', '沐浴露', '牙膏', '牙刷', '洗衣液', '日用品', '清洁', '垃圾袋', '电池', '灯泡', '毛巾', '拖鞋'] },
    { key: '居住', emoji: '🏠', color: '#8a6a4f', words: ['房租', '租金', '水费', '电费', '水电', '燃气', '物业', '房贷', '维修', '家具', '宽带', '话费', '酒店', '住宿'] },
    { key: '娱乐', emoji: '🎬', color: '#a3742f', words: ['电影', '游戏', '唱歌', 'KTV', 'ktv', '酒吧', '旅游', '门票', '演唱会', '展览', '健身', '游泳', '会员', '桌游', '密室', '剧本杀', '按摩', '足疗'] },
    { key: '医疗', emoji: '💊', color: '#4f8c86', words: ['医院', '看病', '挂号', '买药', '药店', '药', '体检', '牙医', '门诊', '疫苗', '诊所'] },
    { key: '人情', emoji: '🎁', color: '#b35a5a', words: ['红包', '礼物', '份子钱', '随礼', '请客', '送礼', '生日', '结婚', '满月'] },
    { key: '学习', emoji: '📚', color: '#5b6fae', words: ['书', '图书', '课程', '学费', '培训', '文具', '打印', '考试', '网课', '订阅', '资料'] },
    { key: '其他', emoji: '📦', color: '#6f7a73', words: [] },
  ];

  const CATEGORY_MAP = new Map(CATEGORIES.map(c => [c.key, c]));
  const getCategory = key => CATEGORY_MAP.get(key) || CATEGORY_MAP.get('其他');

  /* ================= 金额与文本解析 ================= */
  const CN_NUM_SRC = '[零〇一二两三四五六七八九十百千万点]+';
  const CN_DIGIT_SRC = '[零〇一二两三四五六七八九]';
  const MONEY_SRC = '(?:块钱|块|元|圆)';

  const CN_DIGITS = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  const CN_UNITS = { 十: 10, 百: 100, 千: 1000 };

  function cnToNumber(raw) {
    const s = String(raw).replace(/〇/g, '零').replace(/两/g, '二');
    if (/^\d+(?:\.\d+)?$/.test(s)) return parseFloat(s);

    const [intStr, decStr] = s.split('点');
    let total = 0, section = 0, number = 0;

    for (const ch of intStr || '') {
      if (ch in CN_DIGITS) number = CN_DIGITS[ch];
      else if (ch in CN_UNITS) {
        if (number === 0) number = 1;
        section += number * CN_UNITS[ch];
        number = 0;
      } else if (ch === '万') {
        section += number;
        total += (section || 1) * 10000;
        section = 0;
        number = 0;
      }
    }

    let val = total + section + number;

    // 口语省略：一百二 = 120，两千五 = 2500，一千二百三 = 1230
    const m = /([百千万])([一二三四五六七八九])$/.exec(intStr || '');
    if (m && !/零/.test(intStr)) {
      const unit = m[1] === '万' ? 10000 : CN_UNITS[m[1]];
      const digit = CN_DIGITS[m[2]];
      val = val - digit + (digit * unit) / 10;
    }

    let dec = 0;
    if (decStr) {
      let ds = '';
      for (const ch of decStr) {
        if (ch in CN_DIGITS) ds += CN_DIGITS[ch];
        else if (/\d/.test(ch)) ds += ch;
        else return val;
      }
      dec = parseFloat('0.' + ds) || 0;
    }

    return val + dec;
  }

  const cnOrNumber = s => (/^\d/.test(s) ? parseFloat(s) : cnToNumber(s));

  const AMOUNT_RULES = [
    { re: new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${MONEY_SRC}\\s*(\\d)\\s*(?:毛|角)`, 'g'), value: m => parseFloat(m[1]) + parseInt(m[2], 10) / 10 },
    { re: new RegExp(`(${CN_NUM_SRC})\\s*${MONEY_SRC}\\s*(${CN_DIGIT_SRC})\\s*(?:毛|角)`, 'g'), value: m => cnToNumber(m[1]) + cnToNumber(m[2]) / 10 },
    { re: new RegExp(`(\\d+(?:\\.\\d+)?|${CN_NUM_SRC})\\s*${MONEY_SRC}\\s*半`, 'g'), value: m => cnOrNumber(m[1]) + 0.5 },
    { re: new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${MONEY_SRC}\\s*(\\d)(?=\\s*$)`, 'g'), value: m => parseFloat(m[1]) + parseInt(m[2], 10) / 10 },
    { re: new RegExp(`(${CN_NUM_SRC})\\s*${MONEY_SRC}\\s*(${CN_DIGIT_SRC})(?=\\s*$)`, 'g'), value: m => cnToNumber(m[1]) + cnToNumber(m[2]) / 10 },
    { re: /[¥￥]\s*(\d+(?:\.\d+)?)/g, value: m => parseFloat(m[1]) },
    { re: new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${MONEY_SRC}`, 'g'), value: m => parseFloat(m[1]) },
    { re: new RegExp(`(${CN_NUM_SRC})\\s*${MONEY_SRC}`, 'g'), value: m => cnToNumber(m[1]) },
    { re: new RegExp(`(\\d+(?:\\.\\d+)?|${CN_NUM_SRC})\\s*(?:毛|角)`, 'g'), value: m => cnOrNumber(m[1]) / 10 },
    { re: /(?:花了?|用了?|付了?|消费了?|花费|支出|一共|总共|共计|总计)\s*(\d+(?:\.\d+)?)/g, value: m => parseFloat(m[1]) },
    { re: new RegExp(`(?:花了?|用了?|付了?|消费了?|花费|支出|一共|总共|共计|总计)\\s*(${CN_NUM_SRC})`, 'g'), value: m => cnToNumber(m[1]) },
    { re: /(\d+(?:\.\d+)?)\s*$/g, value: m => parseFloat(m[1]) },
    { re: new RegExp(`(${CN_NUM_SRC})\\s*$`, 'g'), value: m => cnToNumber(m[1]) },
  ];

  const LEAD_FILLERS = /^(?:我|今天|昨天|刚刚|刚才|早上|中午|晚上|下午|上午|夜里|一共|总共|合计|共|又|大概|大约|差不多|花了|花|付了|付|用了|用|消费了|消费|支出|记一笔|记一下|记)/;
  const TAIL_FILLERS = /(?:花了|花|付了|付|用了|用|左右|上下|吧|啊|呀|呢|哦|嘛|的|块钱|块|元|钱|整|一共|总共)$/;

  function cleanNote(raw) {
    let s = raw.replace(/[，,。.；;！!？?、~～\s]+/g, ' ').trim();
    let prev;
    do {
      prev = s;
      s = s.replace(LEAD_FILLERS, '').trim();
      s = s.replace(TAIL_FILLERS, '').trim();
    } while (s !== prev);
    return s.slice(0, 30);
  }

  function detectCategory(text) {
    let best = null, bestLen = 0;
    for (const cat of CATEGORIES) {
      for (const w of cat.words) {
        if (text.includes(w) && w.length > bestLen) {
          best = cat;
          bestLen = w.length;
        }
      }
    }
    return best || CATEGORY_MAP.get('其他');
  }

  function findAmounts(text) {
    const occupied = [];
    const hits = [];
    for (const rule of AMOUNT_RULES) {
      for (const m of text.matchAll(rule.re)) {
        const start = m.index;
        const end = start + m[0].length;
        if (occupied.some(([a, b]) => start < b && end > a)) continue;
        const value = rule.value(m);
        if (!Number.isFinite(value) || value <= 0 || value >= 1e7) continue;
        occupied.push([start, end]);
        hits.push({ start, end, value });
      }
    }
    return hits.sort((a, b) => a.start - b.start);
  }

  function parseSegment(segment) {
    const text = segment.trim();
    if (!text) return [];
    const amounts = findAmounts(text);
    if (!amounts.length) return [];

    let base = text;
    for (let i = amounts.length - 1; i >= 0; i--) {
      base = base.slice(0, amounts[i].start) + ' ' + base.slice(amounts[i].end);
    }
    const baseNote = cleanNote(base);

    const out = [];
    let prevEnd = 0;

    amounts.forEach((a, i) => {
      let chunk = cleanNote(text.slice(prevEnd, a.start));
      if (!chunk && amounts.length === 1) chunk = baseNote;
      if (!chunk) chunk = cleanNote(text.slice(a.end, amounts[i + 1]?.start ?? text.length));

      let category = detectCategory(chunk || text);
      if (category.key === '其他' && chunk) category = detectCategory(text);

      out.push({
        amount: Math.round(a.value * 100) / 100,
        category: category.key,
        note: chunk || category.key,
      });
      prevEnd = a.end;
    });

    return out;
  }

  function parseText(text) {
    const normalized = String(text)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/．/g, '.')
      .replace(/(\d)[,，](?=\d)/g, '$1');

    return normalized
      .split(/[，,。；;！!？?\n]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .flatMap(parseSegment);
  }

  /* ================= 存储与日期 ================= */
  const STORE_KEY = 'suishouji.records.v1';
  const pad = n => String(n).padStart(2, '0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const timeKey = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

  function shiftMonth(key, delta) {
    const [y, m] = key.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return monthKey(d);
  }

  function daysInMonth(key) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }

  let viewMonth = monthKey(new Date());

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.map(r => ({
        id: String(r && r.id ? r.id : uid()),
        date: r && typeof r.date === 'string' ? r.date : dateKey(new Date()),
        time: r && typeof r.time === 'string' ? r.time : '00:00',
        amount: Number(r && r.amount) || 0,
        category: CATEGORY_MAP.has(r && r.category) ? r.category : '其他',
        note: r && typeof r.note === 'string' && r.note ? r.note.slice(0, 40) : '消费',
        createdAt: Number(r && r.createdAt) || Date.now(),
      })).filter(r => r.amount > 0);
    } catch {
      return [];
    }
  }

  let records = loadRecords();

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
    } catch {
      showToast('保存失败：浏览器存储空间不足');
    }
  }

  function sortRecords(list = records) {
    return list.slice().sort((a, b) =>
      b.date.localeCompare(a.date) ||
      b.time.localeCompare(a.time) ||
      b.createdAt - a.createdAt
    );
  }

  function parseDateKey(key) {
    const d = new Date(key + 'T00:00:00');
    return Number.isNaN(d.getTime()) ? new Date() : d;
  }

  function dayLabel(key) {
    const now = new Date();
    const today = dateKey(now);
    const yesterday = dateKey(new Date(now.getTime() - 86400000));
    if (key === today) return '今天';
    if (key === yesterday) return '昨天';
    const d = parseDateKey(key);
    const week = '日一二三四五六'[d.getDay()];
    const year = d.getFullYear() === now.getFullYear() ? '' : `${d.getFullYear()}年`;
    return `${year}${d.getMonth() + 1}月${d.getDate()}日 周${week}`;
  }

  /* ================= 格式化 ================= */
  const nf2 = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 });
  const formatNumber = n => nf2.format(n);
  const money = n => '¥' + nf2.format(n);
  const shortMoney = n => '¥' + (Number.isInteger(n) ? nf0.format(n) : nf2.format(n));

  /* ================= DOM ================= */
  const $ = id => document.getElementById(id);
  const todayLabel = $('todayLabel');
  const sumLabel = $('sumLabel');
  const sumAmount = $('sumAmount');
  const sumMeta = $('sumMeta');
  const sideLabel = $('sideLabel');
  const sideAmount = $('sideAmount');
  const sideMeta = $('sideMeta');
  const monthTitle = $('monthTitle');
  const monthReset = $('monthReset');
  const prevMonth = $('prevMonth');
  const nextMonth = $('nextMonth');
  const catRow = $('catRow');
  const micBtn = $('micBtn');
  const micHint = $('micHint');
  const liveText = $('liveText');
  const manualForm = $('manualForm');
  const manualInput = $('manualInput');
  const listEl = $('list');
  const listCount = $('listCount');
  const toast = $('toast');
  const exportBtn = $('exportBtn');
  const fileNotice = $('fileNotice');
  const editDialog = $('editDialog');
  const editForm = $('editForm');
  const editAmount = $('editAmount');
  const editNote = $('editNote');
  const editCategory = $('editCategory');
  const editDate = $('editDate');

  /* ================= 渲染 ================= */
  function renderTodayLabel() {
    const d = new Date();
    const week = '日一二三四五六'[d.getDay()];
    todayLabel.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 周${week}`;
  }

  function renderMonthBar(isCurrent) {
    const [y, m] = viewMonth.split('-').map(Number);
    monthTitle.textContent = `${y}年${m}月`;
    catRow.setAttribute('aria-label', `${y}年${m}月分类支出`);
    nextMonth.disabled = isCurrent;
    monthReset.disabled = isCurrent;
    monthReset.textContent = isCurrent ? '本月' : '回到本月';
    monthReset.setAttribute('aria-label', isCurrent ? '当前就是本月' : '回到本月');
  }

  function render() {
    const now = new Date();
    const today = dateKey(now);
    const currentMonth = monthKey(now);
    if (viewMonth > currentMonth) viewMonth = currentMonth;
    const isCurrent = viewMonth === currentMonth;

    let todaySum = 0, todayCount = 0, monthSum = 0, monthCount = 0;
    const monthByCat = new Map();
    const monthRecords = [];

    for (const r of records) {
      if (r.date === today) {
        todaySum += r.amount;
        todayCount += 1;
      }
      if (r.date.startsWith(viewMonth)) {
        monthSum += r.amount;
        monthCount += 1;
        monthRecords.push(r);
        monthByCat.set(r.category, (monthByCat.get(r.category) || 0) + r.amount);
      }
    }

    sumLabel.textContent = isCurrent ? '本月支出' : '当月支出';
    sumAmount.textContent = formatNumber(monthSum);
    sumMeta.textContent = monthCount
      ? `共 ${monthCount} 笔`
      : (isCurrent ? '本月还没有记录' : '这个月没有记录');

    if (isCurrent) {
      sideLabel.textContent = '今日';
      sideAmount.textContent = money(todaySum);
      sideMeta.textContent = todayCount ? `${todayCount} 笔` : '还没有记录';
    } else {
      const days = daysInMonth(viewMonth);
      sideLabel.textContent = '日均';
      sideAmount.textContent = money(monthSum / days);
      sideMeta.textContent = `按 ${days} 天计`;
    }

    renderMonthBar(isCurrent);
    renderCats(monthByCat);
    renderList(monthRecords);
  }

  function renderCats(monthByCat) {
    catRow.replaceChildren();

    const top = [...monthByCat.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 4);

    for (const [key, sum] of top) {
      const cat = getCategory(key);
      const chip = document.createElement('span');
      chip.className = 'cat-chip';

      const e = document.createElement('span');
      e.className = 'e';
      e.textContent = cat.emoji;

      const name = document.createElement('span');
      name.textContent = cat.key;

      const amount = document.createElement('b');
      amount.textContent = shortMoney(sum);

      chip.append(e, name, amount);
      catRow.appendChild(chip);
    }
  }

  function renderList(list) {
    listEl.replaceChildren();
    listCount.textContent = list.length ? `共 ${list.length} 笔` : '';

    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';

      const emoji = document.createElement('div');
      emoji.className = 'empty-emoji';
      emoji.textContent = '🧾';

      const title = document.createElement('p');
      title.className = 'empty-title';
      title.textContent = viewMonth === monthKey(new Date()) ? '这个月还没记账' : '这个月没有记录';

      const sub = document.createElement('p');
      sub.className = 'empty-sub';
      sub.innerHTML = '点上面的话筒，说一句「午饭 28 块」<br>一次说多笔可以用逗号分开';

      empty.append(emoji, title, sub);
      listEl.appendChild(empty);
      return;
    }

    const groups = new Map();
    for (const r of sortRecords(list)) {
      if (!groups.has(r.date)) groups.set(r.date, []);
      groups.get(r.date).push(r);
    }

    for (const [date, recs] of groups) {
      const section = document.createElement('section');
      section.className = 'day';

      const head = document.createElement('div');
      head.className = 'day-head';

      const label = document.createElement('strong');
      label.textContent = dayLabel(date);

      const total = document.createElement('span');
      total.className = 'day-total';
      total.textContent = shortMoney(recs.reduce((s, r) => s + r.amount, 0));

      head.append(label, total);

      const items = document.createElement('div');
      items.className = 'items';
      for (const r of recs) items.appendChild(itemNode(r));

      section.append(head, items);
      listEl.appendChild(section);

  function itemNode(r) {

    const row = document.createElement('div');

    row.append(icon, main, amt, del);
    return row;
  }

  /* ================= 新增 ================= */
  function commitParsed(parsed) {
    if (!parsed.length) return false;

    const now = new Date();
    const base = Date.now();
    const added = parsed.map((p, i) => ({
      id: uid(),
      date: dateKey(now),
      time: timeKey(now),
      amount: Math.round(p.amount * 100) / 100,
      category: p.category,
      note: p.note,
      createdAt: base + i,
    }));

    records.push(...added);
    persist();
    viewMonth = monthKey(now);
    render();

    const total = added.reduce((s, r) => s + r.amount, 0);
    showToast(
      added.length > 1 ? `已记 ${added.length} 笔 · ¥${formatNumber(total)}` : `已记下 · ¥${formatNumber(total)}`,
      '撤销',
      () => {
        const ids = new Set(added.map(r => r.id));
        records = records.filter(r => !ids.has(r.id));
        persist();
        render();
      }
    );

    return true;
  }

  function handleTranscript(text) {
    const parsed = parseText(text);
    if (!parsed.length) {
      showToast('这句没听出金额，试试「午饭 30 块」');
      return;
    }
    commitParsed(parsed);
  }

  /* ================= 删除 ================= */
  function deleteRecord(id) {
    const idx = records.findIndex(r => r.id === id);
    if (idx < 0) return;

    const [removed] = records.splice(idx, 1);
    persist();
    render();

    showToast(`已删除 · ¥${formatNumber(removed.amount)}`, '撤销', () => {
      records.push(removed);
      persist();
      render();
    });
  }

  /* ================= 切换月份 ================= */

  /* ================= 提示条 ================= */
  let toastTimer = null;

  function showToast(message, actionLabel, action) {
    clearTimeout(toastTimer);
    toast.replaceChildren();

    const text = document.createElement('span');
    text.textContent = message;
    toast.appendChild(text);

    if (actionLabel && action) {
      const btn = document.createElement('button');
      btn.type = 'button';

      btn.textContent = actionLabel;
      btn.addEventListener('click', () => {
        action();
        hideToast();
      });
      toast.appendChild(btn);
    }

    toast.classList.remove('show');
    requestAnimationFrame(() => toast.classList.add('show'));
    toastTimer = setTimeout(hideToast, 4600);
  }

  function hideToast() {
    toast.classList.remove('show');
    clearTimeout(toastTimer);
  }

  /* ================= 手动输入 ================= */
  manualForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = manualInput.value.trim();
    if (!text) return;

    const parsed = parseText(text);
    if (!parsed.length) {
      manualInput.classList.add('shake');
      showToast('没找到金额，试试「午饭 28 块」');
      setTimeout(() => manualInput.classList.remove('shake'), 400);
      manualInput.focus();
      return;
    }

    commitParsed(parsed);
    manualInput.value = '';
    manualInput.focus();
  });

  /* ================= 语音 ================= */
  const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;

  // 手机端走第三方识别：浏览器录音 → Netlify 函数 → 百度短语音识别。
  // 密钥只放在 Netlify 环境变量里，前端拿不到。
  const ASR_ENDPOINT = '/.netlify/functions/asr';
  const ASR_RATE = 16000;
  const ASR_MAX_MS = 55000;

  let serverAsrReady = null; // null=探测中，true/false=函数是否可用

  let recog = null;
  let wantListen = false;
  let listening = false;
  let errorStreak = 0;
  let restartFails = 0;
  let restartTimer = null;
  let micMessage = '';
  let liveTimer = null;

  // 录音相关（手机端）
  let audioCtx = null;
  let mediaStream = null;
  let sourceNode = null;
  let processorNode = null;
  let sinkNode = null;
  let audioChunks = [];
  let recordStartAt = 0;
  let recordTimer = null;
  let serverStarting = false;
  let serverRecording = false;
  let transcribing = false;

  function probeServerAsr() {
    if (!/^https?:$/.test(location.protocol)) {
      serverAsrReady = false;
      updateMicUI();
      return;
    }

    fetch(ASR_ENDPOINT, { method: 'GET', cache: 'no-store' })
      .then(res => (res.ok ? res.json() : null))
      .then(data => { serverAsrReady = Boolean(data && data.ready); })
      .catch(() => { serverAsrReady = false; })
      .then(() => updateMicUI());
  }

  function hasMicApi() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function setupSpeech() {
    if (SpeechRecognitionClass) {
      recog = new SpeechRecognitionClass();
      recog.lang = 'zh-CN';
      recog.continuous = true;
      recog.interimResults = true;
      recog.maxAlternatives = 1;

      recog.onstart = () => {
        listening = true;
        restartFails = 0;
        updateMicUI();
      };

      recog.onresult = event => {
        errorStreak = 0;

        let interim = '';
        const finals = [];

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = result[0] && result[0].transcript ? result[0].transcript : '';
          if (result.isFinal) finals.push(transcript);
          else interim += transcript;
        }

        if (interim) showLive(interim);
        if (finals.length) {
          const text = finals.join(' ');
          showLive(text);
          handleTranscript(text);
        }
      };

      recog.onerror = event => {
        const err = event.error;

        if (err === 'not-allowed' || err === 'service-not-allowed') {
          micMessage = '麦克风被拒绝了，请在地址栏允许麦克风';
          stopListening();
          return;
        }

        if (err === 'network') {
          errorStreak += 1;
          if (errorStreak >= 2) {
            micMessage = '语音服务连接失败，可以直接打字记录';
            stopListening();
          }
          return;
        }

        if (err === 'audio-capture') {
          micMessage = '没找到麦克风，请检查系统设置';
          stopListening();
        }
        // no-speech / aborted 不打断
      };

      recog.onend = () => {
        listening = false;

        if (wantListen) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            if (!wantListen) return;
            try {
              recog.start();
            } catch {
              restartFails += 1;
              if (restartFails > 2) {
                wantListen = false;
                micMessage = '语音识别中断了，请再点一下话筒';
                updateMicUI();
              }
            }
          }, 300);
        } else {
          updateMicUI();
        }
      };
    }

    probeServerAsr();
    updateMicUI();
  }

  function updateMicUI() {
    const busy = listening || transcribing || serverStarting;
    micBtn.classList.toggle('listening', busy);
    micBtn.setAttribute('aria-pressed', busy ? 'true' : 'false');
    micBtn.setAttribute('aria-label', busy ? '停止语音记账' : '开始语音记账');

    micBtn.disabled = !serverAsrReady && !recog && !hasMicApi();

    if (transcribing) {
      micHint.textContent = '正在识别…';
      micHint.classList.remove('warn');
    } else if (serverStarting) {
      micHint.textContent = '正在打开麦克风…';
      micHint.classList.remove('warn');
    } else if (listening) {
      micHint.textContent = serverRecording ? '正在录音… 说完点一下结束' : '正在听… 说完点一下结束';
      micHint.classList.remove('warn');
    } else {
      micHint.textContent = micMessage || '点一下，说出花了多少';
      micHint.classList.toggle('warn', Boolean(micMessage));
    }
  }

  function showLive(text) {
    liveText.textContent = text ? `“${text.trim()}”` : '';
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => {
      liveText.textContent = '';
    }, 2600);
  }

  function startListening() {
    micMessage = '';

    // 部署到 Netlify 且函数可用时，优先用第三方识别（手机端也能用）
    if (serverAsrReady) {
      startServerRecording();
      return;
    }

    if (recog) {
      startWebListening();
      return;
    }

    micMessage = hasMicApi()
      ? '语音服务还没配置好，可以直接打字记录'
      : '这个浏览器不支持语音识别，可以直接打字记录';
    updateMicUI();
  }

  function startWebListening() {
    if (!recog) return;

    micMessage = '';
    errorStreak = 0;
    wantListen = true;
    listening = true;
    updateMicUI();

    try {
      recog.start();
    } catch {
      // 已经在录制中，忽略
    }
  }

  function stopListening() {
    wantListen = false;
    clearTimeout(restartTimer);
    listening = false;

    if (recog) {
      try { recog.stop(); } catch { /* 已停止 */ }
    }

    updateMicUI();
  }

  /* ---------- 手机端：录音并交给 Netlify 函数识别 ---------- */
  async function startServerRecording() {
    if (serverStarting || serverRecording || transcribing) return;

    serverStarting = true;
    micMessage = '';
    updateMicUI();

    // 必须在点击手势里同步创建，否则 iOS Safari 可能不让音频上下文启动
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
    } catch {
      serverStarting = false;
      micMessage = '这个浏览器无法录音，可以直接打字记录';
      updateMicUI();
      return;
    }

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    } catch (err) {
      serverStarting = false;
      releaseRecorder();
      const name = err && err.name;
      micMessage = name === 'NotAllowedError' || name === 'SecurityError'
        ? '麦克风被拒绝了，请在浏览器设置里允许麦克风'
        : '没找到麦克风，请检查系统设置';
      updateMicUI();
      return;
    }

    try {
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

      processorNode.onaudioprocess = event => {
        if (!serverRecording) return;
        audioChunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
      };

      // 需要一个输出节点，部分浏览器才会持续回调 onaudioprocess
      sinkNode = audioCtx.createGain();
      sinkNode.gain.value = 0;

      sourceNode.connect(processorNode);
      processorNode.connect(sinkNode);
      sinkNode.connect(audioCtx.destination);
    } catch {
      serverStarting = false;
      releaseRecorder();
      micMessage = '这个浏览器无法录音，可以直接打字记录';
      updateMicUI();
      return;
    }

    serverStarting = false;
    serverRecording = true;
    listening = true;
    audioChunks = [];
    recordStartAt = Date.now();

    clearTimeout(recordTimer);
    recordTimer = setTimeout(stopServerRecording, ASR_MAX_MS);

    updateMicUI();
  }

  async function stopServerRecording() {
    if (!serverRecording) return;

    const duration = Date.now() - recordStartAt;
    const sourceRate = audioCtx ? audioCtx.sampleRate : ASR_RATE;

    serverRecording = false;
    listening = false;
    clearTimeout(recordTimer);

    const chunks = audioChunks;
    audioChunks = [];
    releaseRecorder();

    if (duration < 350) {
      micMessage = '没听清，请再说一次';
      updateMicUI();
      return;
    }

    const wav = encodeWav(resampleTo16k(concatChunks(chunks), sourceRate), ASR_RATE);

    transcribing = true;
    micMessage = '';
    updateMicUI();

    let fallbackToWeb = false;

    try {
      const res = await fetch(ASR_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audio: base64FromBytes(wav) })
      });

      if (res.status === 404 || res.status === 405) throw new Error('missing');
      if (!res.ok) throw new Error('http');

      const data = await res.json();

      if (data && data.text) {
        showLive(data.text);
        handleTranscript(data.text);
      } else if (data && data.error) {
        micMessage = data.error;
      } else {
        micMessage = '没听清，请再说一次';
      }
    } catch (err) {
      if (err && err.message === 'missing') {
        serverAsrReady = false;
        fallbackToWeb = Boolean(recog);
        if (!fallbackToWeb) micMessage = '语音服务还没配置好，可以直接打字记录';
      } else if (err && err.message === 'http') {
        micMessage = '语音服务出错了，可以直接打字记录';
      } else {
        micMessage = '语音服务连接失败，可以直接打字记录';
      }
    }

    transcribing = false;
    updateMicUI();

    if (fallbackToWeb) startWebListening();
  }

  function releaseRecorder() {
    clearTimeout(recordTimer);

    if (processorNode) {
      processorNode.onaudioprocess = null;
      try { processorNode.disconnect(); } catch { /* 已断开 */ }
    }
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch { /* 已断开 */ }
    }
    if (sinkNode) {
      try { sinkNode.disconnect(); } catch { /* 已断开 */ }
    }
    processorNode = null;
    sourceNode = null;
    sinkNode = null;

    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    if (audioCtx) {
      try { audioCtx.close(); } catch { /* 已关闭 */ }
      audioCtx = null;
    }
  }

  function concatChunks(chunks) {
    let total = 0;
    for (const chunk of chunks) total += chunk.length;

    const merged = new Float32Array(total);
    let offset = 0;
    for (const chunk of chunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    return merged;
  }

  function resampleTo16k(input, sourceRate) {
    if (!input.length || sourceRate === ASR_RATE) return input;

    const ratio = sourceRate / ASR_RATE;
    const output = new Float32Array(Math.floor(input.length / ratio));

    for (let i = 0; i < output.length; i++) {
      const pos = i * ratio;
      const i0 = Math.floor(pos);
      const i1 = Math.min(i0 + 1, input.length - 1);
      const frac = pos - i0;
      output[i] = input[i0] * (1 - frac) + input[i1] * frac;
    }
    return output;
  }

  function encodeWav(samples, rate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    const writeString = (offset, text) => {
      for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    };

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);        // PCM
    view.setUint16(22, 1, true);        // 单声道
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
      const sample = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      offset += 2;
    }

    return new Uint8Array(buffer);
  }

  function base64FromBytes(bytes) {
    let binary = '';
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }

  micBtn.addEventListener('click', () => {
    if (transcribing || serverStarting) return;
    if (serverRecording) { stopServerRecording(); return; }
    if (wantListen) { stopListening(); return; }
    startListening();
  });

  /* ================= 导出 CSV ================= */
  exportBtn.addEventListener('click', () => {
    if (!records.length) {
      showToast('还没有可导出的记录');
      return;
    }

    const rows = [['日期', '时间', '分类', '备注', '金额']];
    for (const r of sortRecords()) {
      rows.push([r.date, r.time, r.category, r.note, r.amount.toFixed(2)]);
    }

    const csv = '﻿' + rows
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\r\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `随手记-${dateKey(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    showToast('已导出 CSV');
  });

  /* ================= 初始化 ================= */
  CATEGORIES.forEach(cat => {
    const option = document.createElement('option');
    option.value = cat.key;
    option.textContent = `${cat.emoji} ${cat.key}`;
    editCategory.appendChild(option);
  });

  $('noticeClose').addEventListener('click', () => {
    fileNotice.hidden = true;
  });

  if (location.protocol === 'file:') {
    fileNotice.hidden = false;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (wantListen) stopListening();
      if (serverRecording) stopServerRecording();
    } else {
      renderTodayLabel();
      render();
    }
  });

  setupSpeech();
  renderTodayLabel();
  render();
})();
</script>
</body>
</html>
